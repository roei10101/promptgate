# GoReleaser configuration: builds release archives when a v* tag is pushed.
# Check locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

project_name: promptgate

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: promptgate
    main: ./cmd/promptgate
    binary: promptgate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: promptgate
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore\\(deps\\)"
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other changes
      order: 999

release:
  github:
    owner: roei10101
    name: promptgate
  draft: false
  prerelease: auto
